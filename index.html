<!DOCTYPE html>
<html lang="en" >
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title> Plant shop</title> <link rel="stylesheet" href="style.css">
</head>

<body>
<header class ="header">
    <button class="hamburger-btn" id="hamburger-btn">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <div class="logo">
        <span class="logo-icon">🌱</span>Plant shop
    </div>
    <button class="cart-btn" id="cart-btn">🛒cart (0)</button>
</header>
<nav class="menu" id="menu">
    <button class="menu-pill active" data-category="all">All</button>
    <button class="menu-pill" data-category="plants">Plants</button>
    <button class="menu-pill" data-category="pots">Pots</button>
    <button class="menu-pill" data-category="tools">Tools</button>
</nav>
<div class="mobile-menu hidden" id="mobile-menu" >
    <div class="menu-overlay" id="menu-overlay"></div>
    <div class="menu-content">
        <div class="menu-header">
            <h3>Categories</h3>
            <button class="close-menu-btn" id="close-menu-btn">✖</button>
        </div>
        <div class="menu-links">
            <button class="menu-link active" data-category="all">All</button>
            <button class="menu-link" data-category="plants">Plants</button>
            <button class="menu-link" data-category="pots">Pots</button>
            <button class="menu-link" data-category="tools">Tools</button>
        </div>
    </div>
</div>
<div class="toolbar">
    <input type="text" class="search-input" placeholder="🔎 Sarch plants..." id="seach-input">

       <select id="sort-dropdown" class="sort-dropdown">
        <option value="default">Sort by</option>
        <option value="price-low">Price: Low to High</option>
        <option value="price-high">Price High to Low</option>
        <option value="rating">Top Rated</option>
       </select>
    </div>
<main class="product-grid" id="product-grid">

</main>
<footer class="footer">
    <p>Made by Somi.2026</p>
    <p>A mini project</p>
</footer>

<div class="cart-modal hidden" id="cart-modal">
    <div class="cart-overlay" id="cart-overlay"></div>
    <div class="cart-content">
        <div class="cart-header">
            <h2>Your cart</h2>
            <button class="close-cart-btn" id="close-cart-btn">❌</button>
        </div>
        <div class="cart-body" id="cart-body">
           
        </div>
        <div class="cart-footer" id="cart-footer">
            <div class="cart-total">
                <span>Total</span>
                <span id="cart-total-price">$0</span>
            </div>
            <button class="clear-cart-btn" id="clear-cart-btn">Clear cart</button>
            <button class="checkout-btn">Checkout</button>
        </div>
    </div>
</div>
<script src="products.js"></script>
<script src="app.js"></script>
</body>
</html>
